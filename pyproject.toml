[project]
name = "flask-web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "ms-identity-python[flask]",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[tool.uv.sources]
ms-identity-python = { git = "https://github.com/azure-samples/ms-identity-python", rev = "0.9" }

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle エラー
    "F",    # pyflakes（未使用 import / 変数など）
    "I",    # isort（import 順）
    "UP",   # pyupgrade（古い書き方の近代化）
    "B",    # flake8-bugbear（バグりやすい書き方）
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app", "app_config", "main"]
